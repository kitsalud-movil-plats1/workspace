# Igual que kit01 recién instalado: solo wan0 por DHCP; lan0 arriba y sin direcciones.
version: 2
ethernets:
  wan0:
    match:
      macaddress: "52:54:00:4b:01:01"
    set-name: wan0
    dhcp4: true
    dhcp6: false
    accept-ra: false
  lan0:
    match:
      macaddress: "52:54:00:4b:01:02"
    set-name: lan0
    dhcp4: false
    dhcp6: false
    accept-ra: false
